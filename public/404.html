<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>DSA Revision Tracker</title>
    <script type="text/javascript">
      // GitHub Pages SPA fallback
      // This file is served for any 404 and redirects to index.html
      // The single page app is then responsible for client-side routing
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/')
          .replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
